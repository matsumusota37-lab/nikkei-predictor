name: research-fetch
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLリストのファイル（research/ 内）"
        default: "urls.txt"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 取得
        working-directory: research
        run: mkdir -p raw && ./fetch_raw.sh "${{ inputs.urls }}" | tee raw/_log.txt
      - name: 取得結果を research-raw ブランチに保存
        run: |
          cp -r research/raw /tmp/raw
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan research-raw
          git rm -rfq .
          cp -r /tmp/raw/. .
          git add -A
          git commit -qm "raw fetch $(date -u +%FT%TZ)"
          git push -fq origin research-raw
